<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Bluetti Watcher: keeps a Windows PC running through power cuts on a BLUETTI station">
<style>
.ring{stroke-dasharray:741.4;animation:drain 10s ease-in-out infinite;transform:rotate(-90deg);transform-origin:1010px 200px}
@keyframes drain{0%{stroke-dashoffset:0;stroke:#3d8b44}45%{stroke:#b7801c}75%{stroke-dashoffset:704.3;stroke:#c2413f}88%{stroke-dashoffset:704.3;stroke:#c2413f}100%{stroke-dashoffset:0;stroke:#3d8b44}}
.step{opacity:.35;animation:lit 9.6s infinite}
@keyframes lit{0%,4%{opacity:.35}8%,22%{opacity:1}30%,100%{opacity:.35}}
.s0{animation-delay:0.0s}.s1{animation-delay:1.6s}.s2{animation-delay:3.2s}.s3{animation-delay:4.8s}.s4{animation-delay:6.4s}.s5{animation-delay:8.0s}
.bolt{animation:blink 10s infinite}
@keyframes blink{0%,10%{opacity:1}14%,86%{opacity:.15}92%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="1280" height="400" rx="24" fill="#f4f5f7"/>
<rect x="16" y="16" width="1248" height="368" rx="20" fill="#ffffff" stroke="#d9dce1"/>
<text x="64" y="118" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="60" font-weight="700" fill="#1d1f23">Bluetti Watcher</text>
<text x="64" y="168" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="23" fill="#5e636b">Keeps your Windows PC running through power cuts on a</text>
<text x="64" y="200" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="23" fill="#5e636b">BLUETTI station - and hibernates it before the battery is empty.</text>
<text x="64" y="244" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="14" fill="#2f6be0">Bluetooth LE · read only · one NativeAOT exe · dashboard on 127.0.0.1</text>
<g class="step s0"><rect x="64" y="268" width="184" height="36" rx="18" fill="#eceef1" stroke="#b7801c" stroke-opacity=".7"/><circle cx="84" cy="286" r="5" fill="#b7801c"/><text x="98" y="291" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="15" fill="#1d1f23">Mains lost</text></g><g class="step s1"><rect x="260" y="268" width="184" height="36" rx="18" fill="#eceef1" stroke="#2f6be0" stroke-opacity=".7"/><circle cx="280" cy="286" r="5" fill="#2f6be0"/><text x="294" y="291" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="15" fill="#1d1f23">Eco</text></g><g class="step s2"><rect x="456" y="268" width="184" height="36" rx="18" fill="#eceef1" stroke="#b7801c" stroke-opacity=".7"/><circle cx="476" cy="286" r="5" fill="#b7801c"/><text x="490" y="291" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="15" fill="#1d1f23">20 % emergency</text></g><g class="step s3"><rect x="64" y="316" width="184" height="36" rx="18" fill="#eceef1" stroke="#c2413f" stroke-opacity=".7"/><circle cx="84" cy="334" r="5" fill="#c2413f"/><text x="98" y="339" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="15" fill="#1d1f23">10 % stop</text></g><g class="step s4"><rect x="260" y="316" width="184" height="36" rx="18" fill="#eceef1" stroke="#c2413f" stroke-opacity=".7"/><circle cx="280" cy="334" r="5" fill="#c2413f"/><text x="294" y="339" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="15" fill="#1d1f23">5 % hibernate</text></g><g class="step s5"><rect x="456" y="316" width="184" height="36" rx="18" fill="#eceef1" stroke="#3d8b44" stroke-opacity=".7"/><circle cx="476" cy="334" r="5" fill="#3d8b44"/><text x="490" y="339" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="15" fill="#1d1f23">Mains back</text></g>
<circle cx="1010" cy="200" r="118" fill="none" stroke="#eceef1" stroke-width="22"/>
<circle class="ring" cx="1010" cy="200" r="118" fill="none" stroke="#3d8b44" stroke-width="22" stroke-linecap="round"/>
<g class="bolt" transform="translate(988 138)"><path d="M26 0 L4 36 H20 L14 64 L40 24 H24 Z" fill="#b7801c"/></g>
<text x="1010" y="238" text-anchor="middle" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="18" fill="#5e636b">battery</text>
<text x="1010" y="264" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, Consolas, monospace' font-size="15" fill="#5e636b">read every minute</text>
</svg>
