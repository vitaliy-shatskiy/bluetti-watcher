name: Bug report
description: Something Bluetti Watcher does wrong or does not do.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Remove your station's Bluetooth address (MAC) and anything personal from the logs
        before you paste them. A security problem goes through [SECURITY.md](https://github.com/vitaliy-shatskiy/bluetti-watcher/blob/main/SECURITY.md), not here.
  - type: input
    id: version
    attributes:
      label: Bluetti Watcher version
      description: "`version` from http://127.0.0.1:18940/api/health, or the release zip's name."
      placeholder: 1.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: "`winver` shows it."
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Station model
      description: The `type` in config.json and the model printed on the station.
      placeholder: AC200PL
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where the readings come from
      options:
        - Bluetooth LE only
        - Bluetooth LE with the cloud fallback
        - Mostly the cloud fallback (Bluetooth does not answer)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Include what the dashboard showed and the time it happened.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Last 50 lines of service.log (MAC removed)
      description: |
        `Get-Content "$env:LOCALAPPDATA\bluetti-watcher\service.log" -Tail 50`
      render: text
    validations:
      required: true
  - type: textarea
    id: dryrun
    attributes:
      label: Installer dry run (for install or upgrade problems)
      description: "The output of `pwsh -NoProfile -File install.ps1` (no `-Apply`) from the release folder."
      render: text
