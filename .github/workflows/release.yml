name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: .NET tests
        run: dotnet test --solution bluetti-watcher.slnx -c Release

      # NativeAOT needs the MSVC linker; the runner image carries Visual Studio with the C++ tools.
      - name: Publish NativeAOT (win-x64)
        run: |
          pwsh -NoProfile -NonInteractive -File tools/publish.ps1 -Out dist/pkg/bin
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # The release notes: the tag's section of CHANGELOG.md (Keep a Changelog), heading excluded. No section, no release.
      - name: Release notes
        id: notes
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:REF_NAME.TrimStart('v')
          $lines = Get-Content -LiteralPath CHANGELOG.md
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## \[(.+?)\]' -and $Matches[1] -eq $version) { $start = $i; break }
          }
          if ($start -lt 0) { Write-Output "no '## [$version]' section in CHANGELOG.md"; exit 1 }
          $body = [System.Collections.Generic.List[string]]::new()
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## \[' -or $lines[$i] -match '^\[[^\]]+\]:\s') { break }
            $body.Add($lines[$i])
          }
          $text = ($body -join "`n").Trim()
          if (-not $text) { Write-Output "the '## [$version]' section of CHANGELOG.md is empty"; exit 1 }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $file = 'dist/release-notes.md'
          [IO.File]::WriteAllText((Join-Path $PWD $file), $text + "`n")
          "file=$file" >> $env:GITHUB_OUTPUT

      # The zip: bin (no .pdb, .xml or logs) + power-mode + install.ps1 and the tools it loads + THIRD-PARTY-NOTICES.md +
      # everything the READMEs link to (docs, CONTRIBUTING, SECURITY, CHANGELOG, LICENSE, integrations).
      - name: Package
        id: package
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:REF_NAME.TrimStart('v')
          $pkg = 'dist/pkg'
          Get-ChildItem "$pkg/bin" -File -Recurse | Where-Object { $_.Extension -in '.log', '.pdb', '.xml' } | Remove-Item
          if (-not (Test-Path "$pkg/bin/BluettiWatcher.exe")) { Write-Output 'no BluettiWatcher.exe in the publish output'; exit 1 }
          New-Item -ItemType Directory -Force -Path "$pkg/power-mode", "$pkg/tools", "$pkg/docs" | Out-Null
          Copy-Item power-mode/*.ps1 "$pkg/power-mode/"
          if (Test-Path power-mode/README.md) { Copy-Item power-mode/README.md "$pkg/power-mode/" }
          Copy-Item tools/swap.ps1, tools/wake-task.ps1 "$pkg/tools/"
          Copy-Item docs/*.md, docs/*.png "$pkg/docs/"
          if (Test-Path integrations/claude-code) {
            New-Item -ItemType Directory -Force -Path "$pkg/integrations" | Out-Null
            Copy-Item integrations/claude-code "$pkg/integrations/" -Recurse
          }
          # The exe carries code ported from bluetti-bt-lib (MIT): no release without its notice.
          if (-not (Test-Path -LiteralPath THIRD-PARTY-NOTICES.md)) { Write-Output 'no THIRD-PARTY-NOTICES.md: the release needs it'; exit 1 }
          Copy-Item install.ps1, README.md, LICENSE, THIRD-PARTY-NOTICES.md $pkg
          foreach ($f in 'README.uk.md', 'CHANGELOG.md', 'CONTRIBUTING.md', 'SECURITY.md') { if (Test-Path $f) { Copy-Item $f $pkg } }
          # The README images and videos stay out of the zip: the packaged READMEs point at them on GitHub, at this tag.
          $raw = "https://raw.githubusercontent.com/${{ github.repository }}/$env:REF_NAME/docs/"
          foreach ($readme in Get-ChildItem $pkg -Filter 'README*.md' -File) {
            $text = Get-Content -Raw -LiteralPath $readme.FullName
            $text = [regex]::Replace($text, '((?:src|srcset|href)="|\]\()docs/(media|demos)/', { param($m) $m.Groups[1].Value + $raw + $m.Groups[2].Value + '/' })
            [IO.File]::WriteAllText($readme.FullName, $text)
          }
          # Every relative link and image in the READMEs must resolve inside the package.
          $missing = @()
          foreach ($readme in Get-ChildItem $pkg -Filter 'README*.md' -File) {
            $text = Get-Content -Raw -LiteralPath $readme.FullName
            $targets = [regex]::Matches($text, '\]\(([^)\s]+)\)|<img[^>]*\ssrc="([^"]+)"') | ForEach-Object { if ($_.Groups[1].Success) { $_.Groups[1].Value } else { $_.Groups[2].Value } }
            foreach ($t in $targets) {
              if ($t -match '^(https?:|mailto:|#)') { continue }
              $path = ($t -split '#')[0]
              if ($path -and -not (Test-Path (Join-Path $pkg $path))) { $missing += "$($readme.Name): $t" }
            }
          }
          if ($missing) { Write-Output "links that do not resolve in the package:"; $missing | Write-Output; exit 1 }
          $bad = Get-ChildItem "$pkg/bin" -File -Recurse | Where-Object { $_.Extension -in '.pdb', '.xml' }
          if ($bad) { Write-Output "debug or doc files left in bin: $($bad.Name -join ', ')"; exit 1 }
          $zip = "dist/bluetti-watcher-$version-win-x64.zip"
          Compress-Archive -Path "$pkg/*" -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$zip.sha256" -Value "$hash  $(Split-Path $zip -Leaf)" -NoNewline
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          ZIP: ${{ steps.package.outputs.zip }}
          NOTES: ${{ steps.notes.outputs.file }}
        run: |
          gh release create $env:REF_NAME $env:ZIP "$($env:ZIP).sha256" --title "Bluetti Watcher $env:REF_NAME" --notes-file $env:NOTES --verify-tag
          if ($LASTEXITCODE -ne 0) { exit 1 }
