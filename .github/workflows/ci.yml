name: CI

# main and pull requests only: a PR branch push runs once (pull_request), a tag runs release.yml alone.
# A change to documentation only starts no run. Files that code or tests read stay out of this list:
# integrations/claude-code/power-mode*.rules.md (the hook and its test read them).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'integrations/claude-code/README.md'
      - 'power-mode/README.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'integrations/claude-code/README.md'
      - 'power-mode/README.md'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR cancels the run it supersedes; every other run has a group of its own and always finishes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Two jobs in parallel: the run takes as long as the slowest one, not the sum.
jobs:
  dotnet:
    name: .NET tests
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: .NET tests
        run: dotnet test --solution bluetti-watcher.slnx -c Release

      # The power-mode tests again, every call through the forwarder scripts (pwsh power-mode.ps1, 5.1 power-mode-end.ps1).
      - name: Power-mode tests through the scripts
        run: |
          $env:PM_SWITCH_ENTRY = 'script'
          dotnet test --solution bluetti-watcher.slnx -c Release --no-build --filter FullyQualifiedName~BluettiWatcher.Tests.PowerModeScript

  tools:
    name: PowerShell tool tests
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      # install.ps1's dry run (tools/test-install.ps1) checks for dotnet on PATH.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json


      - name: PowerShell tool tests
        run: |
          $failed = @()
          foreach ($t in Get-ChildItem tools -Filter 'test-*.ps1' | Sort-Object Name) {
            Write-Output "== $($t.Name)"
            pwsh -NoProfile -NonInteractive -File $t.FullName
            # 0 passed, 1 failed, 2 did not run: only 0 is a pass.
            if ($LASTEXITCODE -ne 0) { $failed += "$($t.Name) (exit $LASTEXITCODE)" }
          }
          if ($failed) { Write-Output "failed: $($failed -join ', ')"; exit 1 }
