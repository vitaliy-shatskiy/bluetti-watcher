<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bluetti Watcher</title><link rel="icon" id="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2212%22 fill=%22%23191a1c%22/%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2224%22 fill=%22none%22 stroke=%22%235fad65%22 stroke-width=%227%22/%3E%3C/svg%3E">
<style>
:root{--frame:#26282c;--bg:#191a1c;--raised:#2b2d31;--line:#34363b;--text:#dfe1e5;--dim:#8b8e95;--ok:#5fad65;--warn:#e0a53a;--bad:#db5c5c;--accent:#548af7;--load:#548af7;--cut:rgba(224,165,58,.10)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--frame);color:var(--text);font:13px/18px "Segoe UI",system-ui,sans-serif;padding:14px}
main{max-width:1180px;margin:0 auto;display:grid;gap:5px}
.card{background:var(--bg);border-radius:10px;padding:14px 16px;min-width:0}
h1{font-size:14px;line-height:20px;margin:0;font-weight:600}
h2{font-size:12px;line-height:16px;margin:0 0 8px;font-weight:400;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:4px;background:var(--raised);font-size:12px;color:var(--text);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
#ecoChip{font-variant-numeric:tabular-nums}
.chip.ok i{background:var(--ok)}.chip.warn i{background:var(--warn)}.chip.bad i{background:var(--bad)}.chip.acc i{background:var(--accent)}
.top{display:grid;grid-template-columns:300px 1fr;gap:5px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.k{color:var(--dim);font-size:12px}
.v{font-size:26px;line-height:34px;font-variant-numeric:tabular-nums;white-space:nowrap}
.v small{font-size:13px;color:var(--dim);margin-left:4px}
.s{color:var(--dim);font-size:12px;min-height:18px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.dim{color:var(--dim)}
.ring{display:grid;place-items:center;position:relative}
.ring svg{width:230px;height:230px;display:block}
.ring .mid{position:absolute;text-align:center}
.ring .pct{font-size:52px;line-height:56px;font-variant-numeric:tabular-nums;font-weight:600}
.ring .wh{color:var(--dim);font-size:12px}
.bar{display:flex;gap:6px;align-items:center}
.seg{display:flex;background:var(--raised);border-radius:4px;padding:2px;gap:2px}
.seg button{all:unset;cursor:pointer;height:22px;padding:0 10px;border-radius:3px;font-size:12px;color:var(--dim)}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--text)}
.seg button:focus-visible{outline:1px solid var(--accent)}
.legend{display:flex;gap:16px;color:var(--dim);font-size:12px;flex-wrap:wrap}
.legend b{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
#chart{width:100%;height:auto;display:block;margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:5px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{text-align:left;padding:5px 8px;border-top:1px solid var(--line);font-size:12px;white-space:nowrap}
th{color:var(--dim);font-weight:400;border-top:0}
.rowbar{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;font-size:12px;min-height:24px}
.rowbar>span{min-width:0}
.rowbar>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowbar .track{height:8px;border-radius:4px;background:var(--raised);overflow:hidden}
.rowbar .fill{height:100%;border-radius:4px;background:var(--load)}
.rowbar .n{text-align:right;font-variant-numeric:tabular-nums}
details summary{cursor:pointer;color:var(--dim);font-size:12px}
#tip{position:fixed;pointer-events:none;background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;line-height:16px;display:none;z-index:5;white-space:nowrap}
.note{color:var(--dim);font-size:12px;margin-top:8px}
@media(max-width:900px){.top{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
</style></head><body><main>
<div class="card head"><h1 id="title"></h1><span class="chip" id="gridChip"><i></i><span></span></span><span class="chip" id="ecoChip" hidden><i></i><span></span></span><span class="chip warn" id="staleChip" hidden><i></i><span></span></span><span class="chip acc" id="maxChip" hidden><i></i><span></span></span><span class="chip" id="noteChip" hidden><i></i><span></span></span><span class="sp"></span><div class="seg" id="modeSeg" role="group" data-i18n-aria="powerMode"><button data-m="auto" data-i18n="modeAuto" data-i18n-title="modeAutoTip"></button><button data-m="eco" data-i18n="modeEco" data-i18n-title="modeEcoTip"></button><button data-m="max" data-i18n="modeMax" data-i18n-title="modeMaxTip"></button></div><div class="seg" id="langSeg" role="group" data-i18n-aria="language"><button data-lang="en" data-i18n="langEn"></button><button data-lang="uk" data-i18n="langUk"></button></div><span class="dim" id="readAt"></span></div>

  <div class="tiles">
    <div class="card"><div class="k" data-i18n="loadNow"></div><div class="v" id="load"></div><svg id="spark" viewBox="0 0 200 34" style="width:100%;height:34px;display:block"></svg><div class="s" id="loadSub"></div></div>
    <div class="card"><div class="k" data-i18n="timeLeft"></div><div class="v" id="left"></div><div class="s" id="leftSub"></div><div class="s" id="leftSub2"></div></div>
    <div class="card"><div class="k" id="cutK" data-i18n="thisCut"></div><div class="v" id="cut"></div><div class="s" id="cutSub"></div><div class="s" id="cutSub2"></div></div>
    <div class="card"><div class="k" data-i18n="reaches"></div><div id="reach"></div></div>
    <div class="card"><div class="k" data-i18n="output"></div><div class="v" id="volt"></div><div class="s" id="voltSub"></div></div>
    <div class="card"><div class="k" data-i18n="today"></div><div class="v" id="today"></div><div class="s" id="todaySub"></div><div class="s" id="todaySub2"></div></div>
  </div>
</div>

<div class="card" id="dtekCard" hidden><div class="bar"><h2 style="margin:0" data-i18n="dtekTitle"></h2><span style="flex:1"></span><span class="chip" id="dtekChip"><i></i><span></span></span></div>
  <div id="dtekBody" style="margin-top:6px"></div><div class="note" id="dtekNote"></div></div>

<div class="card">
  <div class="bar"><h2 style="margin:0" data-i18n="batteryAndLoad"></h2><span style="flex:1"></span>
    <div class="seg" id="rangeSeg" role="group" data-i18n-aria="range"><button data-h="1"></button><button data-h="4"></button><button data-h="8"></button><button data-h="24"></button></div></div>
  <svg id="chart" viewBox="0 0 1140 300" role="img" data-i18n-aria="chartAria"></svg>
  <div class="legend"><span><b style="background:var(--ok)"></b><span data-i18n="legendBattery"></span></span><span><b style="background:var(--load)"></b><span data-i18n="legendLoad"></span></span><span><b style="background:var(--warn);opacity:.5;height:10px"></b><span data-i18n="legendGridOff"></span></span><span><b style="background:repeating-linear-gradient(135deg,#9a9da4 0 2px,rgba(139,142,149,.15) 2px 5px);height:10px"></b><span data-i18n="legendNoData"></span></span><span id="count"></span></div>
</div>

<div class="two">
  <div class="card"><h2 data-i18n="energyPerHour"></h2><svg id="hours" viewBox="0 0 560 150" style="width:100%;height:auto;display:block"></svg><div class="note" id="hoursNote"></div></div>
  <div class="card"><h2 data-i18n="cyclesTitle"></h2><div id="cycles"></div><div class="note" data-i18n="cyclesNote"></div></div>
</div>

<div class="two">

  <div class="card"><h2 data-i18n="powerCuts"></h2><table><thead><tr><th data-i18n="colStart"></th><th data-i18n="colEnd"></th><th data-i18n="colLength"></th><th data-i18n="colBattery"></th><th data-i18n="colUsed"></th></tr></thead><tbody id="cuts"></tbody></table></div>
</div>

<div class="note" data-i18n="readOnlyNote"></div></div>

  for (const p of [0, 25, 50, 75, 100]) { s += `<line x1="${L}" x2="${W - R}" y1="${ys(p)}" y2="${ys(p)}" stroke="#34363b" ${p ? 'stroke-dasharray="2 5"' : ''}/><text x="${L - 8}" y="${ys(p) + 4}" fill="#8b8e95" font-size="12" text-anchor="end">${p}%</text><text x="${W - R + 8}" y="${ys(p) + 4}" fill="#8b8e95" font-size="12">${uW(Math.round(maxLoad * p / 100))}</text>`; }
  for (const p of [D.thresholds.emergencyAt, D.thresholds.stopAt]) s += `<line x1="${L}" x2="${W - R}" y1="${ys(p)}" y2="${ys(p)}" stroke="${p === D.thresholds.stopAt ? '#db5c5c' : '#e0a53a'}" stroke-opacity=".55" stroke-dasharray="6 4"/>`;
  const step = hours <= 1 ? 10 : hours <= 4 ? 30 : hours <= 8 ? 60 : 180, first = Math.ceil(t0 / (step * 60000)) * step * 60000;
  for (let t = first; t <= t1; t += step * 60000) s += `<line x1="${x(t).toFixed(1)}" x2="${x(t).toFixed(1)}" y1="${H - B}" y2="${H - B + 4}" stroke="#34363b"/><text x="${x(t).toFixed(1)}" y="${H - 8}" fill="#8b8e95" font-size="12" text-anchor="middle">${hm(t)}</text>`;
  const seg = (fn) => { let d = ''; list.forEach((r, i) => { d += `${i === 0 || r.t - list[i - 1].t > GAP ? 'M' : 'L'}${x(r.t).toFixed(1)},${fn(r).toFixed(1)}`; }); return d; };
  if (list.length) { s += `<path d="${seg((r) => yl(r.load))}" fill="none" stroke="#548af7" stroke-width="1.5" stroke-linejoin="round"/><path d="${seg((r) => ys(r.soc))}" fill="none" stroke="#5fad65" stroke-width="2.2" stroke-linejoin="round"/>`;
    const last = list[list.length - 1]; s += `<circle cx="${x(last.t).toFixed(1)}" cy="${ys(last.soc).toFixed(1)}" r="3.5" fill="#5fad65"/>`;
    if (ahead) { const tEnd = Math.min(t1, last.t + last.soc / perH * 3600000), socEnd = Math.max(0, last.soc - perH * (tEnd - last.t) / 3600000);
      s += `<line x1="${x(last.t).toFixed(1)}" y1="${ys(last.soc).toFixed(1)}" x2="${x(tEnd).toFixed(1)}" y2="${ys(socEnd).toFixed(1)}" stroke="#5fad65" stroke-width="1.5" stroke-dasharray="5 5" stroke-opacity=".7"/>`
        + `<line x1="${x(NOW).toFixed(1)}" x2="${x(NOW).toFixed(1)}" y1="${T}" y2="${H - B}" stroke="#8b8e95" stroke-opacity=".35"/><text x="${(x(NOW) + 6).toFixed(1)}" y="${T + 12}" fill="#8b8e95" font-size="12">${t('nowForecast')}</text>`; } }
  s += `<line id="cross" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="#8b8e95" stroke-opacity=".6" visibility="hidden"/>`;
  const svg = $('chart'); svg.innerHTML = s; $('count').textContent = t('readingsCount', { n: list.length });
  svg.onmousemove = (e) => { const b = svg.getBoundingClientRect(), px = (e.clientX - b.left) * W / b.width; if (px < L || px > W - R) { svg.onmouseleave(); return; }

    else { if (!list.length) { svg.onmouseleave(); return; }
      let best = list[0]; for (const r of list) if (Math.abs(r.t - tt) < Math.abs(best.t - tt)) best = r;
      c.setAttribute('x1', x(best.t)); c.setAttribute('x2', x(best.t)); c.setAttribute('visibility', 'visible');
      tip.style.display = 'block'; tip.innerHTML = `<b>${hm(best.t)}</b> · ${best.soc}% · ${uW(best.load)} · ${t('tipGrid', { s: best.mains ? t('on') : t('off') })}`; }
    tip.style.left = Math.min(window.innerWidth - tip.offsetWidth - 8, e.clientX + 12) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; };

  // Energy per clock hour
  { const hw = 560, hh = 150, hl = 40, hb = 24, ht = 8, buckets = new Map();
    for (let i = 1; i < list.length; i++) { const dt = list[i].t - list[i - 1].t; if (dt > GAP) continue; const k = Math.floor(list[i].t / 3600000); buckets.set(k, (buckets.get(k) || 0) + (list[i].load + list[i - 1].load) / 2 * dt / 3600000); }
    const k1 = Math.floor(NOW / 3600000), n = Math.min(24, Math.max(4, hours)), keys = Array.from({ length: n }, (_, i) => k1 - n + 1 + i), mxE = Math.max(50, ...keys.map((k) => buckets.get(k) || 0));
    const bw = (hw - hl - 8) / n; let h = `<line x1="${hl}" x2="${hw - 8}" y1="${hh - hb}" y2="${hh - hb}" stroke="#34363b"/><text x="${hl - 6}" y="${ht + 10}" fill="#8b8e95" font-size="12" text-anchor="end">${Math.round(mxE)}</text><text x="${hl - 6}" y="${hh - hb + 4}" fill="#8b8e95" font-size="12" text-anchor="end">${uWh(0)}</text>`;
    keys.forEach((k, i) => { const e = buckets.get(k) || 0, bh = (hh - hb - ht) * e / mxE, bx = hl + i * bw + 2;
      h += `<rect x="${bx.toFixed(1)}" y="${(hh - hb - bh).toFixed(1)}" width="${Math.max(2, bw - 4).toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="#548af7" fill-opacity="${k === k1 ? .55 : 1}"><title>${pad(new Date(k * 3600000).getHours())}:00 · ${uWh(Math.round(e))}</title></rect>`;
      if (n <= 8 || i % Math.ceil(n / 8) === 0) h += `<text x="${(bx + bw / 2 - 2).toFixed(1)}" y="${hh - 6}" fill="#8b8e95" font-size="12" text-anchor="middle">${pad(new Date(k * 3600000).getHours())}</text>`; });
    $('hours').innerHTML = h; const firstK = rows.length ? Math.floor(rows[0].t / 3600000) : k1; // the hour the record began in is partial too
    const full = keys.slice(0, -1).filter((k) => k !== firstK).map((k) => buckets.get(k) || 0).filter((e) => e > 0);
    const avgE = full.length ? full.reduce((a, b) => a + b, 0) / full.length : 0;
    $('hoursNote').textContent = full.length ? t('hoursNoteFull', { avg: uWh(Math.round(avgE)), n: fmt(D.capacityWh * (D.learnedEfficiency || D.efficiency) / avgE) }) : t('hoursNoteFirst'); }
  // Cycles above the base load
  { const sorted = list.map((r) => r.load).sort((a, b) => a - b), base = sorted.length ? sorted[Math.floor(0.15 * sorted.length)] : 0, thr = base + 35; const found = []; let cur = null;
    list.forEach((r, i) => { const broke = i > 0 && r.t - list[i - 1].t > GAP; if (r.load >= thr && !broke) { if (!cur) cur = { a: r.t, b: r.t, sum: 0, n: 0 }; cur.b = r.t; cur.sum += r.load - base; cur.n++; } else if (cur) { found.push(cur); cur = null; } });
    const openNow = cur; const done = found.filter((c) => c.b - c.a >= 2 * 60000 && c.b - c.a <= 45 * 60000);
    const row = (k, v) => `<div class="rowbar" style="grid-template-columns:150px 1fr"><span title="${k}">${k}</span><span class="n" style="text-align:left">${v}</span></div>`;
    const avgLen = done.length ? done.reduce((s2, c) => s2 + (c.b - c.a), 0) / done.length : 0, avgW = done.length ? done.reduce((s2, c) => s2 + c.sum / c.n, 0) / done.length : 0;
    $('cycles').innerHTML = row(t('cycBase'), uW(base)) + row(t('cycCount'), done.length ? String(done.length) : t('noneYet')) + row(t('cycAvgLen'), done.length ? dur(avgLen) : '–') + row(t('cycAvgExtra'), done.length ? uW(Math.round(avgW)) : '–')
      + row(t('cycShare'), done.length && list.length > 1 ? `${Math.round(100 * done.reduce((s2, c) => s2 + (c.b - c.a), 0) / (list[list.length - 1].t - list[0].t))} %` : '–') + row(t('cycNow'), openNow ? `<span class="warn">${t('aboveBase', { d: dur(NOW - openNow.a) })}</span>` : t('atBase')); }

    + `<div class="rowbar"><span title="${t('statOnTop')}">${t('statOnTop')}</span><span></span><span class="n">${t('upTo', { w: uW(Math.round(Math.max(0, stats[3][1] - stats[0][1]))) })}</span></div><div class="rowbar"><span title="${t('statEnergy')}">${t('statEnergy')}</span><span></span><span class="n">${uWh(Math.round(wh(list)))}</span></div>`;
}
let range = 8; try { range = Number(localStorage.getItem('station.range')) || 8; } catch (e) { /* private window */ }
document.querySelectorAll('#rangeSeg button').forEach((b) => { b.onclick = () => { range = Number(b.dataset.h); try { localStorage.setItem('station.range', String(range)); } catch (e) { /* ignore */ } paint(); }; });

// Tables
$('cuts').innerHTML = cuts.slice(-8).reverse().map((c) => `<tr><td>${dmy(c.start)} ${hm(c.start)}</td><td>${c.end ? hm(c.end) : (live === c ? `<span class="warn">${t('cutNow')}</span>` : t('unknown'))}</td><td>${dur((c.end || (live === c ? NOW : c.last)) - c.start)}</td><td>${c.socFrom}% → ${c.socTo}%</td><td>${uWh(Math.round(c.wh))}</td></tr>`).join('') || `<tr><td colspan="5" class="dim">${t('noneRecordedYet')}</td></tr>`;

// Service state: the manual mode, Max's battery hours at the current load, rejected readings and a silent station.

const mx = $('maxChip'); mx.hidden = !(D.manual === 'max' && !now.mains && D.hoursLeft) || (D.notes ? D.notes.some((n) => n.code === 'max-held') : (D.note || '').includes('Max held back'));

// The zone the DTEK schedule is published in: 'Europe/Kyiv', or the former name 'Europe/Kiev' in an older browser; null when neither is known.
function kyivZone() {
  for (const z of ['Europe/Kyiv', 'Europe/Kiev']) {
    try { new Intl.DateTimeFormat('en-GB', { timeZone: z }); return z; } catch (e) { /* this browser does not know the name */ }
  }
  return null;
}
// True when the browser's UTC offset at that moment (ms) differs from Kyiv's: the schedule rows then say they are Kyiv time.
function kyivOffsetDiffers(ms) {
  const zone = kyivZone();
  if (!zone) return false;
  try {
    const p = {};
    for (const x of new Intl.DateTimeFormat('en-GB', { timeZone: zone, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric' }).formatToParts(new Date(ms))) p[x.type] = Number(x.value);
    const kyivOffsetMin = Math.round((Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute) - Math.floor(ms / 60000) * 60000) / 60000);
    return kyivOffsetMin !== -new Date(ms).getTimezoneOffset();
  } catch (e) { return false; }
}

// DTEK Watcher: the planned outages of the house's queue, as the service read them. Every text of the site is escaped.
function renderDtek(w, th) {
  const card = $('dtekCard');
  card.hidden = !w || w.state === 'off';
  if (card.hidden) return;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
  const hm = (iso) => { const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const dmy = (iso) => { const d = new Date(iso); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`; };
  // The schedule's day rows are the server's Kyiv wall time (w.today, q.today): an interval named beside them uses the same clock.
  const kyiv = (iso, o) => { const zone = kyivZone(); return new Intl.DateTimeFormat('en-GB', zone ? { timeZone: zone, ...o } : o).format(new Date(iso)); };
  const kyivTag = kyivOffsetDiffers(Date.now()) ? ` <span class="dim">(${t('kyivTime')})</span>` : '';

  const kyivDmy = (iso) => kyiv(iso, { day: '2-digit', month: '2-digit', year: 'numeric' }).replace(/\//g, '.');
  const row = (k, v) => `<div class="rowbar" style="grid-template-columns:150px 1fr"><span class="dim" title="${esc(k)}">${esc(k)}</span><span>${v}</span></div>`;
  const chip = $('dtekChip'), label = { ok: t('dtekOk'), stale: t('dtekStale'), none: t('dtekNone') }[w.state] || w.state;
  chip.className = 'chip ' + (w.state === 'ok' ? 'ok' : w.state === 'stale' ? 'warn' : 'bad'); chip.lastChild.textContent = label;
  const origin = { manual: t('originManual'), detected: w.queueSource === 'single' ? t('originSingle') : t('originDetected'), 'manual-refuted': t('originRefuted') }[w.queueOrigin] || '';
  const doubt = w.queueContradictions > 0 ? ` · ${t('cutsAgainst', { n: Number(w.queueContradictions) })}` : '';
  let s = row(t('queue'), w.queue ? `${esc(qd(w.queue))} <span class="dim">(${esc(origin + doubt)})</span>`
    : w.queues.length ? `${esc(w.queues.map(qd).join(', '))} <span class="dim">(${esc([t('notFixed'), origin].filter(Boolean).join(' · '))})</span>` : `<span class="dim">${t('unknown')}</span>`);
  if (w.update || w.collectedAt) s += row(t('schedule'), t('scheduleLine', { u: esc(w.update || t('unknown')), c: w.collectedAt ? dmy(w.collectedAt) + ' ' + hm(w.collectedAt) : t('unknown'), s: esc(w.source ? val(w.source) : t('none')) }));
  s += row(t('sources'), t('sourcesLine', { d: esc(val(w.datasetState)), s: esc(val(w.siteState)) }));
  // a set of queues: its planned outage is the union, and each interval says which of its queues it came from

  const nextFrom = isSet ? esc(qd((w.nextQueues || []).join('+'))) : esc(qd(w.nextQueue));
  if (w.nextStart) s += row(t('nextOutage'), (Date.parse(w.nextStart) <= Date.now() ? `<span class="warn">${t('cutNow')}</span> ${t('untilAt', { at: hm(w.nextEnd) })}` : `${dmy(w.nextStart)} ${hm(w.nextStart)}-${hm(w.nextEnd)}`) + (w.queue && !isSet ? '' : ` <span class="dim">(${nextFrom})</span>`));
  else if (w.state !== 'none' && w.windows.length) s += row(t('nextOutage'), `<span class="dim">${t('noneInSchedule')}</span>`);
  const lasts = val(w.batteryLasts);
  const lastsText = ` · ${t('batteryLasts')}: <span class="${{ yes: 'ok', no: 'bad' }[w.batteryLasts] || 'dim'}">${esc(lasts)}</span>`;
  if (w.overdue) {
    // the planned window has ended and mains is still off: the plan no longer says when, the battery alone does
    s += row(t('plannedReturn'), `<s>${dmy(w.plannedReturn)} ${hm(w.plannedReturn)}</s> <span class="bad">${t('overdueBy', { n: Number(w.overdueMin) })}${w.state === 'none' ? ' ' + t('againstLastPlan') : ''}</span>`);
    const today = dmy(new Date().toISOString());
    s += row(t('battery'), w.batteryUntil ? `${t('batteryUntil', { at: hm(w.batteryUntil) + (dmy(w.batteryUntil) === today ? '' : ' ' + dmy(w.batteryUntil)) })}${th && th.hibernateAt !== undefined ? ` (${t('hibernateAt', { p: Number(th.hibernateAt) })})` : ''}` : `<span class="dim">${t('unknown')}</span>`);
    if (w.return) s += row(t('expectedReturn'), `${dmy(w.return)} ${hm(w.return)} <span class="dim">(${t('theSite')})</span>` + lastsText);
  } else if (w.batteryLasts) s += row(t('expectedReturn'), (w.return ? `${dmy(w.return)} ${hm(w.return)}` : `<span class="dim">${t('unknown')}</span>`) + lastsText);
  if (w.planChanges >= 1) s += row(t('plan'), `<span class="warn">${t('planChanged', { n: Number(w.planChanges) })}</span>`);
  if (w.lateBackMin !== null && w.lateBackMin !== undefined && w.lateCuts >= 3) {
    const n = Number(w.lateBackMin), k = Number(w.lateCuts);

  if (w.outageKind || w.outageEnd) s += row(t('siteSays'), `${esc(w.outageKind || t('outage'))}${w.outageStart ? ' ' + t('fromX', { x: esc(w.outageStart) }) : ''}${w.outageEnd ? ' ' + t('untilAt', { at: esc(w.outageEnd) }) : ''}`);
  for (const q of w.windows) {

  }
  $('dtekBody').innerHTML = s;
  $('dtekNote').textContent = notesText(w.notes, w.note);
}

// The last answers, so a language switch repaints without a reload or a request.
let lastNow = null, lastRows = null;
function show() {
  if (!lastNow) return;
  renderDtek(lastNow.dtekWatcher, lastNow.thresholds);
  render({ ...lastNow, rows: lastRows });
}
async function load() {
  try {
    const to = Date.now(), from = to - 26 * 3600000;
    const [n, h] = await Promise.all([fetch('/api/now', { cache: 'no-store' }), fetch(`/api/history?from=${from}&to=${to}&step=60`, { cache: 'no-store' })]);
    if (!n.ok || !h.ok) throw new Error(`HTTP ${n.status}/${h.status}`);
    const now = await n.json(), hist = await h.json();
    lastNow = now; lastRows = hist.rows.filter((r) => r.soc !== null);
    show();
  } catch (e) {
    const s = $('staleChip'); s.hidden = false; s.lastChild.textContent = t('serviceDown', { e: e.message });
  }
}
document.querySelectorAll('#langSeg button').forEach((b) => { b.onclick = () => {
  lang = b.dataset.lang === 'uk' ? 'uk' : 'en';
  try { localStorage.setItem('station.lang', lang); } catch (e) { /* private window */ }
  applyStatic(); show();
}; });
// The last mode button's failure stays on the note chip across refreshes until the next press.
var modeError = '';
var ecoTimer = null; // the eco countdown's one-second tick
document.querySelectorAll('#modeSeg button').forEach((b) => { b.onclick = async () => {
  modeError = '';
  try {
    const r = await fetch('/api/mode', { method: 'POST', headers: { 'X-Station': '1', 'Content-Type': 'application/json' }, body: JSON.stringify({ mode: b.dataset.m }) });
    const j = await r.json().catch(() => ({ message: `HTTP ${r.status}` }));
    if (!r.ok) modeError = j.code ? noteText({ code: j.code, text: j.message, args: [] }) : `${b.textContent}: ${j.message || r.status}`;
  } catch (e) {
    modeError = `${b.textContent}: ${t('serviceDown', { e: e.message })}`;
  } finally {
    if (modeError) { const nc = $('noteChip'); nc.hidden = false; nc.lastChild.textContent = modeError; }
    load();
  }
}; });
applyStatic();
load();
setInterval(load, 60000);
