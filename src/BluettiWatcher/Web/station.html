<style>
:root{--frame:#111214;--bg:#1a1b1e;--raised:#26282c;--line:#2c2e33;--edge:rgba(255,255,255,.06);--text:#e4e6ea;--dim:#8b8e95;--ok:#5fad65;--warn:#e0a53a;--bad:#db5c5c;--accent:#548af7;--load:#548af7;--cut:rgba(224,165,58,.10);--onc:rgba(95,173,101,.08);--offc:rgba(224,165,58,.42)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--frame);color:var(--text);font:13px/18px "Segoe UI",system-ui,sans-serif;padding:20px}
main{max-width:1200px;margin:0 auto;display:grid;gap:10px}
.card{background:var(--bg);border:1px solid var(--edge);border-radius:14px;padding:18px 20px;min-width:0}
h1{font-size:16px;line-height:22px;margin:0;font-weight:600}
h2{font-size:11px;line-height:16px;margin:0 0 12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.head{display:grid;grid-template-columns:1fr auto auto;grid-template-areas:"brand mode lang" "chips mode lang";align-items:center;gap:12px 20px}
.head .sp{display:none}
.head .brand{grid-area:brand}.head .chips{grid-area:chips}.head .modebox{grid-area:mode;align-self:start}.head #langSeg{grid-area:lang;align-self:start;margin-top:3px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:34px;height:34px;flex:none}
.brand .sub{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.modebox{display:grid;justify-items:end;gap:4px}
.modebox .hint{color:var(--dim);font-size:12px;max-width:360px;text-align:right}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:26px;max-width:100%;padding:4px 11px;border-radius:13px;background:var(--raised);font-size:12px;line-height:16px;color:var(--text)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
#ecoChip{font-variant-numeric:tabular-nums}
.chip.ok{background:rgba(95,173,101,.13);color:#9bd59f}.chip.warn{background:rgba(224,165,58,.13);color:#efc36f}.chip.bad{background:rgba(219,92,92,.14);color:#ef9191}.chip.acc{background:rgba(84,138,247,.14);color:#94b6fb}
.chip.ok i{background:var(--ok)}.chip.warn i{background:var(--warn)}.chip.bad i{background:var(--bad)}.chip.acc i{background:var(--accent)}
.top{display:grid;grid-template-columns:310px 1fr;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.k{color:var(--dim);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.v{font-size:30px;line-height:38px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.v .na{font-size:16px;font-weight:400;color:var(--dim)}
.v small{font-size:14px;font-weight:400;color:var(--dim);margin:0 6px 0 4px}
.s{color:var(--dim);font-size:12px;min-height:18px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.dim{color:var(--dim)}
.ring{display:grid;place-items:center;position:relative;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.035),transparent 65%),var(--bg)}
.ring svg{width:240px;height:240px;display:block}
.ring .mid{position:absolute;text-align:center;pointer-events:none}
.ring .pct{font-size:56px;line-height:60px;font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:-.02em}
.ring .wh{color:var(--dim);font-size:12px}
.bar{display:flex;gap:8px;align-items:center}
.seg{display:flex;background:var(--frame);border:1px solid var(--edge);border-radius:8px;padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;height:24px;padding:0 11px;border-radius:5px;font-size:12px;color:var(--dim);transition:background .15s,color .15s}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed=true]{background:var(--raised);color:var(--text)}
.seg button:focus-visible{outline:1px solid var(--accent)}
#modeSeg button{height:30px;padding:0 18px;font-size:13px;font-weight:600}
#modeSeg button[aria-pressed=true]{background:var(--accent);color:#fff}
.legend{display:flex;gap:18px;color:var(--dim);font-size:12px;flex-wrap:wrap;margin-top:6px}
.legend b{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
#chart{width:100%;height:auto;display:block;margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{text-align:left;padding:7px 8px;border-top:1px solid var(--line);font-size:12px;white-space:nowrap}
th{color:var(--dim);font-weight:400;border-top:0}
tbody tr:hover td{background:rgba(255,255,255,.025)}
.rowbar{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;font-size:12px;min-height:26px}
.rowbar>span{min-width:0}
.rowbar>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowbar .track{height:6px;border-radius:3px;background:var(--raised);overflow:hidden}
.rowbar .fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#3d6fd6,var(--load))}
.rowbar .n{text-align:right;font-variant-numeric:tabular-nums}
details summary{cursor:pointer;color:var(--dim);font-size:12px}
#tip{position:fixed;pointer-events:none;background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;line-height:16px;display:none;z-index:5;max-width:340px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.note{color:var(--dim);font-size:12px;margin-top:10px}
.dban{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:12px 16px;border-radius:12px;margin:12px 0 16px;font-size:13px}
.dban b{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.dban svg{width:18px;height:18px}
.dban.off{background:rgba(224,165,58,.10);border:1px solid rgba(224,165,58,.35);color:#f3c879}
.dban.ok{background:rgba(95,173,101,.09);border:1px solid rgba(95,173,101,.3);color:#9bd59f}
.dban span{color:var(--text)}
.dtop{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.dq{color:var(--dim);font-size:12px}
.dgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:6px}
.dgrid .c{height:58px;border-radius:9px;border:1px solid var(--edge);background:var(--onc);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12px;font-variant-numeric:tabular-nums;color:#b9c6ba;transition:transform .15s,border-color .15s}
.dgrid .c svg{width:14px;height:14px;color:#6fbf75}
.dgrid .c:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.18)}
.dgrid .c.off{background:var(--offc);border-color:rgba(224,165,58,.55);color:#ffe2a8}
.dgrid .c.off svg{color:#ffd27a}
.dgrid .c.nd{background:repeating-linear-gradient(135deg,rgba(139,142,149,.12) 0 2px,transparent 2px 7px);color:var(--dim)}
.dgrid .c.now{outline:2px solid var(--text);outline-offset:2px}
.dgrid .c.now.off{animation:glow 2s ease-in-out infinite}
#dtekMore{margin-top:14px}#dtekMore[open] summary{margin-bottom:8px}.slegend{display:flex;gap:8px 18px;color:var(--dim);font-size:12px;flex-wrap:wrap;margin:14px 0 4px}
.slegend b{display:inline-block;width:18px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.kpi{background:var(--frame);border:1px solid var(--edge);border-radius:10px;padding:12px 14px;min-width:0}
.kpi .v{font-size:24px;line-height:30px}
.kpi .s{min-height:0}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.kpis{grid-template-columns:repeat(2,1fr);gap:8px}.kpi{padding:10px 12px}.kpi .v{font-size:20px;line-height:26px}}
/* motion: cards rise in once, the ring fills, the chart lines draw on first paint and on a range switch, live dots breathe */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 currentColor}50%{box-shadow:0 0 0 4px transparent}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(224,165,58,.0)}50%{box-shadow:0 0 12px 2px rgba(224,165,58,.55)}}
main>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
main>*:nth-child(2){animation-delay:.06s}main>*:nth-child(3){animation-delay:.12s}main>*:nth-child(4){animation-delay:.18s}main>*:nth-child(5){animation-delay:.24s}main>*:nth-child(n+6){animation-delay:.3s}
.top>.card,.tiles>.card{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.tiles>.card:nth-child(2){animation-delay:.08s}.tiles>.card:nth-child(3){animation-delay:.16s}.tiles>.card:nth-child(4){animation-delay:.1s}.tiles>.card:nth-child(5){animation-delay:.18s}.tiles>.card:nth-child(6){animation-delay:.26s}
.card{transition:border-color .2s,background-color .2s}
.card:hover{border-color:rgba(255,255,255,.11)}
.arc{transition:stroke-dasharray 1.2s cubic-bezier(.2,.7,.2,1),stroke-dashoffset 1.2s cubic-bezier(.2,.7,.2,1)}
@keyframes charge{0%,100%{opacity:1}50%{opacity:.6}}
.charging .arc{animation:charge 2.4s ease-in-out infinite}
.chip i{color:inherit}
#gridChip i,#ecoChip i{animation:breathe 2.4s ease-in-out infinite}
.intro .socl,.intro .loadl{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.3,.6,.2,1) forwards}
.intro .loadl{animation-delay:.15s}
.intro .area,.intro .fc{animation:fade .9s ease .5s both}
.intro rect.hbar{transform-box:fill-box;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.7,.2,1) both}
.rowbar .fill{transition:width .8s cubic-bezier(.2,.7,.2,1)}



@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* wide monitors (2K): a wider page, the same layout */
@media(min-width:1800px){main{max-width:1560px}body{padding:28px}.top{grid-template-columns:360px 1fr}.ring svg{width:280px;height:280px}.ring .pct{font-size:64px;line-height:68px}.v{font-size:34px;line-height:42px}}
@media(min-width:2200px){html{zoom:1.15}}
@media(max-width:900px){.head{grid-template-columns:1fr auto;grid-template-areas:"brand lang" "chips chips" "mode mode"}.top{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.modebox{justify-items:start}.modebox .hint{text-align:left}.dgrid{grid-template-columns:repeat(6,1fr)}}
/* phones */
@media(max-width:600px){body{padding:10px}main{gap:8px}.card{padding:14px;border-radius:12px}.tiles{gap:8px}.v{font-size:24px;line-height:30px}.v small{font-size:12px;margin:0 4px 0 2px}
  .ring svg{width:200px;height:200px}.ring .pct{font-size:46px;line-height:50px}
  #modeSeg{width:100%}#modeSeg button{flex:1;text-align:center;padding:0 8px}.modebox{justify-items:stretch}
  .dgrid{gap:4px}.dgrid .c{height:48px;font-size:11px;gap:3px}.dban b{font-size:14px}
  #dtekBody .rowbar{grid-template-columns:1fr!important;gap:0;margin-bottom:6px}
  .ring svg{width:220px;height:220px}.ring .wh{font-size:11px;line-height:15px}.ring{padding:12px}
  td,th{padding:6px 4px;font-size:11px}.bar{flex-wrap:wrap}}

  let grid = shown.length ? `<div class="dtop"><span class="dq">${t('queue')} ${esc(shown.map((q) => qd(q.queue)).join(', '))}</span><div class="seg" id="dtekTabs">${tab('today', t('dtekTodayDay', { d: w.today.slice(0, 5) }), shown.some((q) => q.today))}${tab('tomorrow', t('dtekTomorrowDay', { d: w.tomorrow.slice(0, 5) }), shown.some((q) => q.tomorrow))}</div></div>` : '';
  for (const q of shown) {
    const text = tomorrowPicked ? q.tomorrow : q.today;
    const spans = (q.intervals || []).map((i) => [minOf(i.start, day), minOf(i.end, day)]).filter(([a, b]) => b > a);
    let cells = '';
    for (let h = 0; h < 24; h++) {
      const a0 = h * 60, b0 = a0 + 60, cover = spans.map(([a, b]) => [Math.max(a, a0), Math.min(b, b0)]).filter(([a, b]) => b > a).sort((p, q2) => p[0] - q2[0]);
      const full = cover.length === 1 && cover[0][0] === a0 && cover[0][1] === b0;
      const fill = cover.length && !full ? `background:linear-gradient(90deg,${cover.map(([a, b]) => `transparent ${(a - a0) / 0.6}%,var(--offc) ${(a - a0) / 0.6}% ${(b - a0) / 0.6}%,transparent ${(b - a0) / 0.6}%`).join(',')}),var(--onc)` : '';
      const cls = ['c', text ? '' : 'nd', cover.length ? 'off' : '', day === nowDay && nowMin >= a0 && nowMin < b0 ? 'now' : ''].filter(Boolean).join(' ');
      cells += `<div class="${cls}" style="${text ? fill : ''}" title="${pad(h)}:00–${pad((h + 1) % 24)}:00 · ${text ? (cover.length ? t('outage') : t('dtekPowerOn')) : t('noData')}"><span>${pad(h)}–${pad(h + 1)}</span>${text ? (cover.length ? icoOff : icoOn) : ''}</div>`;
    }
    grid += (shown.length > 1 ? `<div class="dq" style="margin:10px 0 6px">${t('queue')} ${esc(qd(q.queue))}</div>` : '') + `<div class="dgrid">${cells}</div>`;
  }
  if (shown.length) grid += `<div class="slegend"><span><b style="background:var(--onc);border:1px solid var(--edge)"></b>${t('dtekPowerOn')}</span><span><b style="background:var(--offc)"></b>${t('outage')}</span><span><b style="background:linear-gradient(90deg,var(--offc) 50%,var(--onc) 50%)"></b>${t('dtekFirstHalf')}</span><span><b style="background:linear-gradient(90deg,var(--onc) 50%,var(--offc) 50%)"></b>${t('dtekSecondHalf')}</span><span><b style="outline:2px solid var(--text);outline-offset:-2px"></b>${t('dtekNowHour')}</span><span><b style="background:repeating-linear-gradient(135deg,rgba(139,142,149,.4) 0 2px,transparent 2px 5px)"></b>${t('noData')}</span>${kyivTag}</div>`;
  $('dtekGrid').innerHTML = grid;
  $('dtekGrid').onclick = (e) => { const b = e.target.closest('[data-day]'); if (b) { dtekDay = b.dataset.day; show(); } };
  $('dtekBody').innerHTML = s;
  $('dtekNote').textContent = notesText(w.notes, w.note);
}

// The last answers, so a language switch repaints without a reload or a request.
let lastNow = null, lastRows = null;
function show() {
  if (!lastNow) return;
  renderDtek(lastNow.dtekWatcher, lastNow.thresholds);
  render({ ...lastNow, rows: lastRows });
}
// Readings come once a minute, so the page asks once a minute, and only while it is seen. The 26 h of history is read whole
// once (and every 30 minutes, to stay honest); in between only the rows after the last one. Nothing new = no repaint, unless
// the last reading is old enough for the stale chip to count up.
const SPAN = 26 * 3600000, POLL = 60000, FULL = 30 * 60000, STALE = 5 * 60000;
let nowText = '', histAt = 0, fullAt = 0, pollTimer = null, loading = null;
// One request pair at a time; a forced one (a mode press, the page seen again) waits for the running one, then reads anew.
function load(force) {
  if (loading) return force ? loading.then(() => load(true)) : loading;
  return (loading = fetchAndShow(force).finally(() => { loading = null; }));
}
async function fetchAndShow(force) {
  try {
    const to = Date.now(), full = !lastRows || to - fullAt >= FULL, from = full ? to - SPAN : histAt + 1000;
    const [n, h] = await Promise.all([fetch('/api/now', { cache: 'no-store' }), fetch(`/api/history?from=${from}&to=${to}&step=60`, { cache: 'no-store' })]);
    if (!n.ok || !h.ok) throw new Error(`HTTP ${n.status}/${h.status}`);
    const text = await n.text(), hist = await h.json();
    const fresh = hist.rows.filter((r) => r.soc !== null), changed = full || fresh.length > 0 || text !== nowText;
    histAt = hist.rows.length ? Date.parse(hist.rows[hist.rows.length - 1].at) : Math.max(histAt, from - 1000);
    if (full) { lastRows = fresh; fullAt = to; }
    else if (fresh.length) {
      const keep = lastRows.findIndex((r) => Date.parse(r.at) >= to - SPAN);
      lastRows = (keep < 0 ? [] : keep ? lastRows.slice(keep) : lastRows).concat(fresh);
    }
    if (text !== nowText) { lastNow = JSON.parse(text); nowText = text; }
    const lastT = lastRows.length ? Date.parse(lastRows[lastRows.length - 1].at) : 0;
    if (changed || force || to - lastT > STALE) show();
  } catch (e) {
    const s = $('staleChip'); s.hidden = false; s.lastChild.textContent = t('serviceDown', { e: e.message });
  }
}
function schedule() { clearTimeout(pollTimer); pollTimer = document.hidden ? null : setTimeout(() => load().then(schedule), POLL); }
// Hidden: no requests and no countdown. Seen again: fresh data at once, then the minute rhythm.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { clearTimeout(pollTimer); pollTimer = null; clearInterval(ecoTimer); ecoTimer = null; }
  else load(true).then(schedule);
});
document.querySelectorAll('#langSeg button').forEach((b) => { b.onclick = () => {
  lang = b.dataset.lang === 'uk' ? 'uk' : 'en';
  try { localStorage.setItem('station.lang', lang); } catch (e) { /* private window */ }
  applyStatic(); show();
}; });
// The last mode button's failure stays on the note chip across refreshes until the next press.
var modeError = '';
var ecoTimer = null; // the eco countdown's one-second tick, stopped while the page is hidden
var dtekDay = 'today'; // the DTEK tab picked: today or tomorrow
var introChart = true; // the chart draws its lines in on the first paint and on a range switch, not on the minute repaint
var iconSoc = null; // the charge the tab icon was last drawn for
document.querySelectorAll('#modeSeg button').forEach((b) => { b.onclick = async () => {
  modeError = '';
  try {
    const r = await fetch('/api/mode', { method: 'POST', headers: { 'X-Station': '1', 'Content-Type': 'application/json' }, body: JSON.stringify({ mode: b.dataset.m }) });
    const j = await r.json().catch(() => ({ message: `HTTP ${r.status}` }));
    if (!r.ok) modeError = j.code ? noteText({ code: j.code, text: j.message, args: [] }) : `${b.textContent}: ${j.message || r.status}`;
  } catch (e) {
    modeError = `${b.textContent}: ${t('serviceDown', { e: e.message })}`;
  } finally {
    if (modeError) { const nc = $('noteChip'); nc.hidden = false; nc.lastChild.textContent = modeError; }
    load(true);
  }
}; });
// a new width redraws the charts at it (a quarter second after the last resize event)
let resizeTimer = null;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(show, 250); });
applyStatic();
load().then(schedule);
</script></body></html>
