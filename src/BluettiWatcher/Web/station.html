<style>

.card{transition:border-color .2s,background-color .2s}

// The Auto rules in order; a saved copy is shown until the first edit, then the edit is kept until saved or cancelled.

async function mpSaveRules() {

// The view: the legacy engine answers 409 and the panel stays away; an unreachable service is said on the panel's line.
// A read sent before a write went out (or while one is out) is dropped: it would paint the choice from before the press.
async function mpRefresh(own) {

  if (!r.ok) return;
  const view = await r.json();
  if (!own && (gen !== mpGen || mpBusy)) return;
  mpEngine = 'v2';
  mpView = view;
  // a change already running when the page opened (a reload mid-switch, the tray): followed each second, at most 60 times
  mpChase = !own && (view.pending || view.switching) ? mpChase + 1 : 0;
  if (mpChase > 0 && mpChase <= 60) setTimeout(() => mpRefresh(), 1000);

// The catalogue the blocks' lines are worded from; the service answers it from its last build at once.
function mpLoadCat() {

// Reading source and cloud sign-in (GET /api/cloud): its own requests and timer, apart from /api/now. The card stays hidden
// when the service has no cloud controls (404). A sign-in waiting for the browser is followed every 2 s, else once a minute.
let cloudNow = null, cloudErr = '', cloudTimer = null, cloudBusy = false, cloudUrl = '';
const CLOUD_CHIP = { ok: 'ok', 'signed-out': 'warn', 'sign-in-needed': 'bad', error: 'bad' };
const SIGNIN_ORIGIN = 'https://sso.bluettipower.com/';

function cloudDate(iso) {
  const d = new Date(iso), p = (n) => String(n).padStart(2, '0');
  return `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function paintCloud() {
  const c = cloudNow;

  document.querySelectorAll('#srcSeg button').forEach((b) => { b.setAttribute('aria-pressed', String(b.dataset.s === c.readingSource)); b.disabled = cloudBusy; });
  const st = c.cloud.state, chip = $('cloudChip');
  chip.className = 'chip' + (CLOUD_CHIP[st] ? ' ' + CLOUD_CHIP[st] : '');
  chip.lastChild.textContent = t('cloudChipText', { s: val(st) });
  // the page words the state itself: the service's detail is English for its log, never shown
  const until = c.cloud.until ? cloudDate(c.cloud.until) : '';
  chip.title = t(CLOUD_TIP[st] || 'cloudTipOff', { d: until });
  $('srcResetBox').hidden = c.readingSourceFrom !== 'page';
  $('srcReset').disabled = cloudBusy;
  const waiting = c.signIn.state === 'waiting';
  $('cloudSignIn').disabled = cloudBusy;
  // signed in with a token that still runs: no sign-in button, only Sign out and until when
  const signInBox = $('cloudSignIn').parentNode;
  if (signInBox) signInBox.hidden = st === 'ok' && !!c.cloud.until && Date.parse(c.cloud.until) > Date.now();
  $('cloudSignOut').disabled = cloudBusy || st === 'signed-out';
  // one short sentence: what is wrong and what to do, else until when the sign-in holds; the source buttons say the rest
  const line = cloudErr || (waiting ? t('cloudWaiting') : c.signIn.state === 'failed' ? t('cloudSignInFailed')
    : st === 'sign-in-needed' ? t('cloudTipSignInNeeded') : st === 'error' ? t('cloudTipError') : until && st === 'ok' ? t('cloudTipOk', { d: until }) : '');

function scheduleCloud() {

}
async function loadCloud() {

    if (r.ok) cloudNow = await r.json(); else if (r.status === 404) cloudNow = null;
  } catch (e) { /* the main poll's stale chip names a service that does not answer */ }

// One write at a time; the answer is the new state. A refusal shows the service's reason (English, as in service.log).
async function cloudPost(path, body) {

    if (r.ok) { const j = await r.json(); cloudNow = j; return j; }

document.querySelectorAll('#langSeg button').forEach((b) => b.addEventListener('click', paintCloud));
